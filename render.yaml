databases:
  - name: prolago-postgres
    databaseName: prolago
    user: prolago_user
    plan: free

services:
  - type: web
    name: prolago-carora
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000}
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: prolago-postgres
          property: connectionString
