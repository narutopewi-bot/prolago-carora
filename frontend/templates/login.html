<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Prolago Carora 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#3b0405] via-[#5c0e12] to-[#8B1E24] min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Tarjeta de Login -->
        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/30">
            <!-- Encabezado con Logo Oficial -->
            <div class="text-center mb-7">
                <img src="/static/img/logo.jpg" alt="Prolago C.A." class="w-24 h-24 rounded-2xl mx-auto mb-3 shadow-xl border-2 border-[#8B1E24]/20 object-cover">
                <h1 class="text-2xl font-black text-slate-900 tracking-tight flex items-center justify-center space-x-1.5">
                    <span>PROLAGO</span>
                    <span class="text-xs font-black px-2 py-0.5 bg-[#8B1E24] text-white rounded-md">C.A.</span>
                </h1>
                <p class="text-[11px] text-[#8B1E24] font-bold tracking-wider uppercase mt-1">Medicina Veterinaria y Alimentos Concentrados</p>
                <p class="text-[11px] text-slate-400 font-semibold mt-0.5">Carora, Lara</p>
            </div>

            <!-- Formulario -->
            <form id="loginForm" onsubmit="hacerLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Usuario</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="username" required autocomplete="username" placeholder="admin o cajero"
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-[#8B1E24] focus:border-[#8B1E24] focus:bg-white focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-[#8B1E24] focus:border-[#8B1E24] focus:bg-white focus:outline-none transition">
                    </div>
                </div>

                <button type="submit" id="btnLogin"
                    class="w-full py-3.5 bg-[#8B1E24] hover:bg-[#72181D] text-white font-bold text-sm rounded-xl shadow-lg shadow-[#8B1E24]/30 transition transform active:scale-95 flex items-center justify-center space-x-2">
                    <span>Ingresar al Sistema</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Acceso Rápido / Información -->
            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-500 mb-2 font-medium">Credenciales iniciales:</p>
                <div class="flex justify-center space-x-2 text-xs">
                    <button onclick="completarLogin('admin', 'admin123')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-mono transition">
                        admin / admin123
                    </button>
                    <button onclick="completarLogin('cajero', 'cajero123')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-mono transition">
                        cajero / cajero123
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center text-slate-400 text-xs mt-6 font-medium">
            &copy; 2026 Prolago Carora &bull; Acceso seguro en la nube
        </p>
    </div>

    <script>
        function completarLogin(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        async function hacerLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verificando...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: `¡Bienvenido, ${data.user.nombre}!`,
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = '/';
                    });
                } else {
                    Swal.fire('Acceso denegado', data.detail || 'Usuario o contraseña inválidos', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Ingresar al Sistema</span> <i class="fa-solid fa-arrow-right"></i>';
                }
            } catch (err) {
                Swal.fire('Error', 'No se pudo conectar al servidor', 'error');
                btn.disabled = false;
                btn.innerHTML = '<span>Ingresar al Sistema</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        }
    </script>
</body>
</html>
